name: Release and Publish

on:
  workflow_dispatch:
    inputs:
      input_version:
        type: choice
        description: >-
          Base version bump. Use "none" to publish the current version exactly
          as-is. Choose patch, minor, or major to increase the version before
          release.
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - none
      prerelease_id:
        type: choice
        description: >-
          Pre-release tag. Use "none" for a stable release. Choose alpha, beta,
          or rc to publish a pre-release and tag it on npm/GitHub.
        required: true
        default: none
        options:
          - none
          - alpha
          - beta
          - rc

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test Swift package
        run: npm run test:ios

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 36]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Android tests
        uses: ./.github/actions/run-android-tests
        with:
          api-level: ${{ matrix.api-level }}

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@lcorg/capacitor-secure-storage
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Set up npm
        run: npm install --global npm@11.15.0

      - name: Import GPG signing key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure Git identity
        run: |
          git config user.name "${{ steps.import-gpg.outputs.name }}"
          git config user.email "${{ steps.import-gpg.outputs.email }}"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test web
        run: npm run test:web

      - name: Run package smoke tests
        run: npm run test:package

      - name: Determine release-it arguments
        id: release_args
        env:
          INPUT_VERSION: ${{ inputs.input_version }}
          PRERELEASE_ID: ${{ inputs.prerelease_id }}
        run: |
          args=()

          if [ "$INPUT_VERSION" != "none" ]; then
            args+=("$INPUT_VERSION")
          fi

          if [ "$PRERELEASE_ID" != "none" ]; then
            args+=("--preRelease=$PRERELEASE_ID")
          fi

          if [ "$INPUT_VERSION" = "none" ] && [ "$PRERELEASE_ID" = "none" ]; then
            args+=("--no-increment")
          fi

          if [ "${#args[@]}" -eq 0 ]; then
            echo "::error::Select a version increment, a pre-release identifier, or both."
            exit 1
          fi

          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        run: npm run release -- ${{ steps.release_args.outputs.args }} --ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Attest release archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/*.tgz
