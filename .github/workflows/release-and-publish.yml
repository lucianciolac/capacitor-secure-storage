name: Release and Publish

on:
  workflow_dispatch:
    inputs:
      input_version:
        type: choice
        description: >-
          Choose auto to use the Conventional Commits recommendation.
          Choose patch, minor, or major to override it.
          Choose none only to increment or graduate an existing pre-release.
        required: true
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
          - none

      prerelease_id:
        type: choice
        description: >-
          Select none for a stable release.
          With input_version none, this graduates the current pre-release without a base-version bump.
          Choose alpha, beta, or rc to create or increment a pre-release.
        required: true
        default: none
        options:
          - none
          - alpha
          - beta
          - rc

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/linting.yml

  test-suite:
    uses: ./.github/workflows/test-suite.yml

  package-integrity:
    uses: ./.github/workflows/package-integrity-check.yml

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [lint, test-suite, package-integrity]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@lcorg/capacitor-secure-storage

    steps:
      - name: Create release app token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.release-app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Import GPG signing key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure Git identity
        run: |
          git config user.name "${{ steps.import-gpg.outputs.name }}"
          git config user.email "${{ steps.import-gpg.outputs.email }}"

      - name: Install dependencies
        run: npm ci

      - name: Determine release-it arguments
        id: release_args
        shell: node {0}
        env:
          INPUT_VERSION: ${{ inputs.input_version }}
          PRERELEASE_ID: ${{ inputs.prerelease_id }}
        run: |
          const { appendFileSync, readFileSync } = require("node:fs");
          const { createRequire } = require("node:module");
          const { resolve } = require("node:path");
          const semver = createRequire(resolve("package.json"))("semver");
          const { INPUT_VERSION, PRERELEASE_ID, GITHUB_OUTPUT } = process.env;
          const args = [];

          if (!["auto", "patch", "minor", "major", "none"].includes(INPUT_VERSION)) {
            throw new Error(`Unsupported release increment: ${INPUT_VERSION}`);
          }
          if (!["none", "alpha", "beta", "rc"].includes(PRERELEASE_ID)) {
            throw new Error(`Unsupported pre-release identifier: ${PRERELEASE_ID}`);
          }

          if (INPUT_VERSION === "none") {
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));

            if (!semver.valid(version)) {
              throw new Error(`Invalid current package version: ${version}`);
            }

            if (!semver.prerelease(version)) {
              throw new Error(`Cannot increment or graduate '${version}': it is already a stable release.`);
            }

            const nextVersion = PRERELEASE_ID === "none"
              ? `${semver.major(version)}.${semver.minor(version)}.${semver.patch(version)}`
              : semver.inc(version, "prerelease", PRERELEASE_ID);

            if (!nextVersion) {
              throw new Error(`Cannot increment pre-release '${version}'.`);
            }

            args.push(nextVersion);
          } else if (INPUT_VERSION !== "auto") {
            args.push(INPUT_VERSION);
          }

          if (PRERELEASE_ID !== "none") {
            args.push(`--preRelease=${PRERELEASE_ID}`);
          }

          console.log(`release-it arguments: ${args.join(" ")}`);
          appendFileSync(GITHUB_OUTPUT, `args=${args.join(" ")}\n`);

      - name: Publish release
        run: npm run release -- ${{ steps.release_args.outputs.args }} --ci
        env:
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}

      - name: Attest release archive
        if: ${{ hashFiles('*.tgz') != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/*.tgz
