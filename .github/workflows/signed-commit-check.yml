name: Signed Commit Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: signed-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-signed-commits:
    name: Check signed commits in PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check signed commits
        uses: 1Password/check-signed-commits-action@ed2885f3ed2577a4f5d3c3fe895432a557d23d52 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          comment: |
            This PR contains unsigned commits. To get your PR merged, please sign those commits (`git rebase --exec 'git commit -S --amend --no-edit -n' @{upstream}`) and force push them to this branch (`git push --force-with-lease`).

            If you're new to commit signing, see GitHub's guides for [GPG](https://docs.github.com/en/authentication/managing-commit-signature-verification/generating-a-gpg-key) or [SSH](https://docs.github.com/en/authentication/connecting-to-github-with-ssh/generating-a-new-ssh-key-and-adding-it-to-the-ssh-agent) commit signing.
