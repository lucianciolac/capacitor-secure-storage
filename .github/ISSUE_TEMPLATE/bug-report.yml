name: Bug report
description: Report a reproducible problem with the plugin.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include passwords, tokens, private keys, or other sensitive information.

        To report a security vulnerability privately, follow the instructions in [SECURITY.md](https://github.com/lucianciolac/capacitor-secure-storage/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem clearly and concisely.
      placeholder: Explain what happened and when it occurs.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Provide the installed version of @lcorg/capacitor-secure-storage.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: capacitor-version
    attributes:
      label: Capacitor version
      description: Provide the installed @capacitor/core version.
      placeholder: 8.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select every platform where the issue occurs.
      multiple: true
      options:
        - iOS
        - Android
        - Web
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system version
      description: For example, iOS 18.0, Android 16, or Chrome 140 on Windows 11.
    validations:
      required: true
  - type: input
    id: android-api-level
    attributes:
      label: Android API level
      description: Required when the issue affects Android.
      placeholder: "36"
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps needed to reproduce the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Describe what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include relevant logs or error messages after removing all sensitive information.
      render: shell
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other information that may help investigate the problem.
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This report does not disclose a security vulnerability or contain sensitive information.
          required: true
