# Keep rules that are intentionally relaxed for Capacitor's native bridge code
# in one place so changes to the lint policy are easy to review.
disabled_rules:
  - identifier_name
  - force_try
  - type_body_length
  - file_length
  - opening_brace
  - function_parameter_count
  - for_where
  - trailing_comma
  - function_body_length
  - type_name
  - line_length
  - large_tuple
  - todo
  - no_space_in_method_call
  - legacy_hashing
  - inclusive_language
  - force_cast

excluded:
  - ios/Pods/
  - node_modules/
  - test-app/ios/App/Pods/
  - test-app/node_modules/
